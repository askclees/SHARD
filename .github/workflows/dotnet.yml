name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: true

    - name: Get version
      id: version
      run: |
        VERSION=$(grep -oP '(?<=<Version>)[^<]+' SHARD/SHARD.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if release exists
      id: check
      run: |
        if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Windows
      if: steps.check.outputs.exists == 'false'
      run: dotnet publish SHARD/SHARD.csproj -c Release -r win-x64 --no-self-contained -o ./publish/win-x64

    - name: Publish Linux
      if: steps.check.outputs.exists == 'false'
      run: dotnet publish SHARD/SHARD.csproj -c Release -r linux-x64 --no-self-contained -o ./publish/linux-x64

    - name: Publish macOS x64
      if: steps.check.outputs.exists == 'false'
      run: dotnet publish SHARD/SHARD.csproj -c Release -r osx-x64 --no-self-contained -o ./publish/osx-x64

    - name: Publish macOS ARM64
      if: steps.check.outputs.exists == 'false'
      run: dotnet publish SHARD/SHARD.csproj -c Release -r osx-arm64 --no-self-contained -o ./publish/osx-arm64

    - name: Zip artifacts
      if: steps.check.outputs.exists == 'false'
      run: |
        cd publish
        zip -r ../SHARD-win-x64.zip win-x64/
        zip -r ../SHARD-linux-x64.zip linux-x64/
        zip -r ../SHARD-osx-x64.zip osx-x64/
        zip -r ../SHARD-osx-arm64.zip osx-arm64/

    - name: Create release
      if: steps.check.outputs.exists == 'false'
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          SHARD-win-x64.zip \
          SHARD-linux-x64.zip \
          SHARD-osx-x64.zip \
          SHARD-osx-arm64.zip \
          --title "SHARD v${{ steps.version.outputs.version }}" \
          --prerelease \
          --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
