name: .NET

on:
  push:
    branches-ignore:
      - 'refs/tags/*'
  pull_request:

# Releases are made by release.yml when a v* tag is pushed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "Category!=Corpus"

    - name: Corpus Recovery Report
      continue-on-error: true
      env:
        CORPUS_REPORT_FILE: ${{ github.workspace }}/corpus-recovery-report.md
      run: dotnet test --no-build --verbosity normal --filter "FullyQualifiedName~GenerateCorpusReport"

    - name: Upload corpus report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: corpus-recovery-report
        path: corpus-recovery-report.md
        if-no-files-found: ignore
