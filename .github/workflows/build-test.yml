name: Build Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'win-x64'
        type: choice
        options:
          - win-x64
          - linux-x64
          - osx-x64
          - osx-arm64

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'win-x64' && 'windows-latest' || inputs.platform == 'linux-x64' && 'ubuntu-latest' || 'macos-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish SHARD/SHARD.csproj
          -c Release
          -r ${{ inputs.platform }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ inputs.platform }}

      - name: Package (Windows)
        if: inputs.platform == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ inputs.platform }}/* -DestinationPath SHARD-${{ inputs.platform }}-test.zip

      - name: Package (Unix)
        if: inputs.platform != 'win-x64'
        run: tar -czf SHARD-${{ inputs.platform }}-test.tar.gz -C publish/${{ inputs.platform }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHARD-${{ inputs.platform }}-test
          path: SHARD-${{ inputs.platform }}-test.*
          retention-days: 7
