name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish SHARD/SHARD.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Set artifact name
        id: name
        shell: bash
        run: echo "artifact=SHARD-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ${{ steps.name.outputs.artifact }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ steps.name.outputs.artifact }} -C publish/${{ matrix.rid }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ steps.name.outputs.artifact }}

  test:
    name: Corpus Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=Corpus"

      - name: Generate corpus report
        continue-on-error: true
        env:
          CORPUS_REPORT_FILE: corpus-recovery-report.md
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~GenerateCorpusReport"

      - name: Generate SHARD-created test report
        continue-on-error: true
        env:
          CORPUS_REPORT_FILE: corpus-recovery-report.md
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~GenerateSHARDCreatedReport"

      - name: Generate orphan-carving report
        continue-on-error: true
        env:
          CORPUS_REPORT_FILE: corpus-recovery-report.md
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~GenerateCarvingReport"

      - name: Rename corpus report
        if: always()
        run: |
          mv corpus-recovery-report.md "SHARD-${{ github.ref_name }}-Validation-Report.md" 2>/dev/null || true

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-recovery-report
          path: "SHARD-${{ github.ref_name }}-Validation-Report.md"
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
