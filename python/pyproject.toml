[project]
name = "shard-native"
version = "0.1.0"
description = "Python bindings for SHARD's forensic SQLite recovery engine, via a Native AOT-published C ABI (SHARD.Native)."
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shard_native*"]
